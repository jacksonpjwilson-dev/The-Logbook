  <style>
    :root { color-scheme: dark; }
    html, body { background: #efe6d6; overscroll-behavior: none; }
    body {
      font-family: "Oswald", system-ui, sans-serif;
      background: #141414;
      color: #efe6d6;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
    }
    input, textarea, select { -webkit-user-select: text; user-select: text; }
    #bootSplash {
      position: fixed; inset: 0; z-index: 9999;
      background: #efe6d6;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity .45s ease;
      padding-top: env(safe-area-inset-top);
    }
    header.sticky { padding-top: env(safe-area-inset-top); }
    #bootSplash.hide { opacity: 0; pointer-events: none; }
    #bootSplash .stamp { color: #1c1814; letter-spacing: .14em; font-size: 2.4rem; }
    #bootSplash .rule { width: 72px; height: 3px; background: #e06a3a; margin: 12px 0 10px; }
    .safe { padding-bottom: max(6.2rem, calc(env(safe-area-inset-bottom) + 4.6rem)); padding-left: 2.4rem; }
    .date-alert { display:none; }
    .date-alert.show { display:block; }
    .rail {
      position: fixed; left: 0; top: 50%; transform: translateY(-50%);
      z-index: 45; display: flex; flex-direction: column; gap: 6px;
    }
    .rail-tab {
      writing-mode: vertical-rl; transform: rotate(180deg);
      background: #1c1c1c; color: #efe6d6; border: 1px solid #3a3a3a;
      border-left: 0; border-radius: 0 10px 10px 0;
      font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
      padding: 14px 7px; font-family: Oswald, sans-serif;
    }
    .rail-tab.open { background: #e06a3a; color: #141414; border-color: #e06a3a; }
    .rail-tab { position: relative; }
    .rail-tab .badge {
      position: absolute; top: 6px; right: 4px;
      writing-mode: horizontal-tb; transform: none;
      width: 8px; height: 8px; border-radius: 99px; background: #e06a3a;
    }
    .rail-tab.open .badge { background: #141414; }
    .daycell.hit-food { background: #1f2a1c; border-color: #3d5a36; }
    .daycell.hit-lift { box-shadow: inset 0 0 0 1px #e06a3a55; }
    .daycell.hit-supp { background-image: linear-gradient(135deg, transparent 70%, #e06a3a44 70%); }
    #scanSheet { display:none; }
    #scanSheet.open { display:flex; }
    .rail-panel {
      display: none; position: fixed; left: 36px; top: 50%; transform: translateY(-50%);
      z-index: 46; width: min(18rem, calc(100vw - 3.5rem));
      background: #1c1c1c; border: 1px solid #3a3a3a; border-radius: 14px; padding: 14px;
      box-shadow: 8px 8px 28px rgba(0,0,0,.4);
    }
    .rail-panel.open { display: block; }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .paper {
      background-color: #efe6d6;
      color: #1c1814;
      border: 1px solid #d4c4a8;
      box-shadow: 0 10px 28px rgba(0,0,0,.22);
    }
    .paper-tight {
      background-color: #e8dcc8;
      color: #1c1814;
    }
    .stamp {
      font-family: "Bebas Neue", "Oswald", sans-serif;
      letter-spacing: .12em;
    }
    .field-input, select.field-input, textarea.field-input {
      background: #262626;
      border: 1px solid #3a3a3a;
      color: #efe6d6;
      border-radius: 8px;
    }
    .field-input::placeholder { color: #9a9388; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
    .daycell { border-radius: 10px; padding: 6px 4px 5px; text-align: left; min-height: 72px; border: 1px solid #3a3a3a; background: #1c1c1c; }
    .daycell.is-rest { background: #121212; border-color: #262626; color: #9a9388; }
    .daycell.is-today { outline: 2px solid #e06a3a; outline-offset: 0; }
    .daycell.is-sel { border-color: #e06a3a; background: #262626; }
    .daycell .dnum { font-size: 11px; color: #9a9388; }
    .daycell.is-today .dnum { color: #efe6d6; font-weight: 700; }
    .daycell .sess { margin-top: 4px; font-size: 10px; font-weight: 600; line-height: 1.15; letter-spacing: .04em; text-transform: uppercase; }
    .daycell .kcal { margin-top: 3px; font-size: 9px; color: #9a9388; font-family: "Share Tech Mono", monospace; }
    .weekrow { display: flex; gap: 10px; align-items: stretch; width: 100%; border: 1px solid #3a3a3a; background: #1c1c1c; border-radius: 14px; padding: 10px 12px; text-align: left; }
    .weekrow.is-sel { border-color: #e06a3a; background: #262626; }
    .weekrow.is-today { box-shadow: inset 3px 0 0 #e06a3a; }
    .weekrow.is-rest { background: #121212; }
    .lift-in { min-height: 44px; font-size: 16px; }
    #foodSheet { display:none; }
    #foodSheet.open { display:flex; }
    .navbtn.active { color: #e06a3a; }
    .navbtn.active svg { stroke: #e06a3a; }
    .meal-row { border-bottom: 1px solid rgba(28,24,20,.12); }
    .split-top { background: #1c1c1c; }
    .horizon { height: 3px; background: #e06a3a; }
    .meal-row:last-child { border-bottom: 0; }
    .donut-center { pointer-events: none; }
  </style>
</head>
<body class="bg-field-900 text-paper-100 min-h-screen">
  <div id="bootSplash" aria-hidden="true">
    <p class="stamp">THE LOGBOOK</p>
    <div class="rule"></div>
    <p style="font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#6b6154">Field notes</p>
  </div>
  <header class="sticky top-0 z-30 bg-field-800/95 backdrop-blur border-b border-field-600">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <button id="openSettings" class="shrink-0 text-brass p-1" aria-label="Settings">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="min-w-0 text-center">
        <h1 class="stamp text-2xl leading-none text-paper-100">THE LOGBOOK</h1>
        <p class="text-[9px] tracking-[0.28em] text-brass uppercase mt-0.5">Daily split. Mission focused.</p>
        <p id="headerSub" class="text-[10px] text-field-400 truncate mt-0.5 font-mono">Local only</p>
      </div>
      <button id="todayJump" class="shrink-0 text-brass p-1" aria-label="Today">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/><path d="M9 14h2v2H9z"/></svg>
      </button>
    </div>
    <div id="dateAlert" class="date-alert bg-brass text-field-950 text-center text-[11px] tracking-[0.14em] uppercase py-2 px-3">
      You are not logging today. <button id="jumpTodayAlert" class="underline font-semibold">Go to today</button>
    </div>
  </header>

  <aside class="rail" aria-label="Daily checks">
    <button type="button" class="rail-tab" data-rail="checks">Checks<span class="badge hidden" id="badgeChecks"></span></button>
  </aside>
  <div id="rail-checks" class="rail-panel">
    <p class="text-[11px] tracking-[0.18em] uppercase text-brass mb-1">Daily checks</p>
    <p id="railChecksDate" class="text-[10px] text-field-400 font-mono mb-3"></p>
    <p class="text-[10px] tracking-[0.16em] uppercase text-field-400 mb-1">Sleep</p>
    <div class="flex gap-2 items-center mb-3">
      <input id="sleepHrs" type="number" step="0.5" min="0" max="16" placeholder="hrs" class="w-20 field-input px-2 py-2" />
      <select id="sleepQ" class="flex-1 field-input px-2 py-2">
        <option value="">Quality</option>
        <option value="poor">Poor</option>
        <option value="ok">Ok</option>
        <option value="good">Good</option>
      </select>
    </div>
    <p class="text-[10px] tracking-[0.16em] uppercase text-field-400 mb-1">Supplements</p>
    <label class="flex items-center gap-2 bg-field-700 rounded-lg px-2 py-2 mb-1 text-sm"><input type="checkbox" id="supC"/> Creatine</label>
    <label class="flex items-center gap-2 bg-field-700 rounded-lg px-2 py-2 mb-1 text-sm"><input type="checkbox" id="supO"/> Omegas</label>
    <label class="flex items-center gap-2 bg-field-700 rounded-lg px-2 py-2 mb-3 text-sm"><input type="checkbox" id="supD"/> Vitamin D</label>
    <p class="text-[10px] tracking-[0.16em] uppercase text-field-400 mb-1">Body weight</p>
    <div class="flex gap-2 items-center">
      <input id="bwInput" type="number" step="0.1" placeholder="lb" class="flex-1 field-input px-2 py-2" />
      <span class="text-xs text-field-400">lb</span>
    </div>
  </div>

  <main class="max-w-3xl mx-auto px-4 pt-4 safe">
    <section id="view-today"></section>
    <section id="view-calendar" class="hidden"></section>
    <section id="view-history" class="hidden">
      <div id="view-progress"></div>
    </section>
    <section id="view-workout" class="hidden"></section>
    <section id="view-food" class="hidden"></section>
    <section id="view-settings" class="hidden"></section>
  </main>

  <div id="scanSheet" class="fixed inset-0 z-50 items-end justify-center bg-black/70">
    <div class="w-full max-w-3xl bg-field-800 rounded-t-3xl p-5 pb-8 border-t border-field-600">
      <div class="flex justify-between items-center mb-3">
        <p class="stamp text-2xl">Scan barcode</p>
        <button id="scanClose" class="text-field-400 uppercase text-xs tracking-wider">Close</button>
      </div>
      <p class="text-xs text-field-400 mb-3">Point the camera at a UPC, or type the number. Known codes use your library; new ones look up Open Food Facts.</p>
      <video id="scanVideo" class="w-full rounded-xl bg-black max-h-56 object-cover mb-3" playsinline muted></video>
      <div class="flex gap-2 mb-3">
        <input id="scanCode" class="flex-1 field-input px-3 py-2" placeholder="Enter barcode" inputmode="numeric" />
        <button id="scanLookup" class="bg-brass text-field-950 font-semibold px-3 rounded-lg">Look up</button>
      </div>
      <p id="scanStatus" class="text-xs text-field-400 min-h-[1.2rem]"></p>
      <div id="scanResult" class="mt-2"></div>
    </div>
  </div>
  <div id="foodSheet" class="fixed inset-0 z-50 items-end justify-center bg-black/60">
    <div class="w-full max-w-3xl paper rounded-t-3xl p-5 pb-8">
      <div class="flex justify-between items-start gap-3">
        <div>
          <p id="sheetName" class="text-xl font-stencil uppercase tracking-wide"></p>
          <p id="sheetSub" class="text-xs text-ink-500 mt-1 font-mono"></p>
        </div>
        <button id="sheetClose" class="text-ink-500 px-2 py-1 uppercase tracking-wider text-xs">Close</button>
      </div>
      <div id="sheetMacros" class="grid grid-cols-2 gap-2 mt-4 text-sm"></div>
    </div>
  </div>

  <nav class="fixed bottom-0 inset-x-0 bg-field-800/96 backdrop-blur border-t border-field-600 z-40" style="padding-bottom: env(safe-area-inset-bottom)">
    <div class="max-w-3xl mx-auto grid grid-cols-5 text-[9px] tracking-[0.12em] uppercase font-stencil">
      <button data-tab="today" class="navbtn active py-3 text-paper-100 flex flex-col items-center gap-1">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2"/><path d="M12 3v3M21 12h-3M12 21v-3M3 12h3"/></svg>
        Today
      </button>
      <button data-tab="workout" class="navbtn py-3 text-field-400 flex flex-col items-center gap-1">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z"/><path d="M8 4v16"/><path d="M11 8h6M11 12h6"/></svg>
        Log
      </button>
      <button data-tab="food" class="navbtn py-3 text-field-400 flex flex-col items-center gap-1">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11h16v9H4z"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/><path d="M4 15h16"/></svg>
        Food
      </button>
      <button data-tab="calendar" class="navbtn py-3 text-field-400 flex flex-col items-center gap-1">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>
        Calendar
      </button>
      <button data-tab="history" class="navbtn py-3 text-field-400 flex flex-col items-center gap-1">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V9l4 3 4-6 4 5 4-3v11H4z"/></svg>
        History
      </button>
    </div>
  </nav>

function isoDate(d) {
  const x = new Date(d); x.setHours(0,0,0,0);
  return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;
}
function parseISO(s) { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function weekday(dateStr) { return parseISO(dateStr).getDay(); }
function epley(w,r) { w=Number(w)||0; r=Number(r)||0; if (!w) return 0; if (r<=1) return w; return w*(1+r/30); }
function bestSet1RM(sets) {
  if (!sets) return 0;
  return Math.max(0, ...sets.map(s => epley(s.w, s.r)));
}
function setVolume(sets) {
  if (!sets) return 0;
  return sets.reduce((n,s)=> n + (Number(s.w)||0)*(Number(s.r)||0), 0);
}
function meals() {
  if (!state.data) return DEFAULT_MEALS.slice();
  if (!state.data.meals || !state.data.meals.length) {
    state.data.meals = DEFAULT_MEALS.map(m => ({ ...m }));
  }
  return state.data.meals;
}
function mealLabel(id) {
  return (meals().find(m => m.id === id) || {}).label || id || "Meal";
}
function defaultMealId() {
  const list = meals();
  const h = new Date().getHours();
  const idx = h < 11 ? 0 : h < 14 ? 1 : h < 17 ? 2 : h < 20 ? 3 : h < 22 ? 4 : 5;
  return list[Math.min(idx, list.length - 1)]?.id || "meal1";
}
function normalizeMeal(m) {
  if (OLD_MEAL_MAP[m]) m = OLD_MEAL_MAP[m];
  const list = meals();
  if (list.some(x => x.id === m)) return m;
  return list[0]?.id || "meal1";
}

function migrateFoodLogs(data) {
  if (!data.meals || !data.meals.length) data.meals = DEFAULT_MEALS.map(m => ({ ...m }));
  if (!data.barcodes) data.barcodes = {};
  Object.keys(data.foodLogs || {}).forEach(d => {
    (data.foodLogs[d] || []).forEach(it => {
      if (OLD_MEAL_MAP[it.meal]) it.meal = OLD_MEAL_MAP[it.meal];
      if (!it.meal) it.meal = "meal1";
    });
  });
  return data;
}

function loadLocal() {
  try {
    const raw = localStorage.getItem(LS_KEY) || localStorage.getItem("liftfuel_v2");
    if (!raw) return defaultData();
    const merged = { ...defaultData(), ...JSON.parse(raw) };
    if (!merged.foods || merged.foods.length < 20) merged.foods = DEFAULT_FOODS;
    const banned = new Set(["chipotle","subway","frozen_yogurt","grilled_cheese","hash_brown","grape_crush","vanilla_chai","frannies"]);
    merged.foods = merged.foods.filter(f => !banned.has(f.id));
    if (!merged.supplements) merged.supplements = {};
    if (!merged.sleep) merged.sleep = {};
    merged.targets = { cal:3800, protein:200, fat:160, carbs:400, ...(merged.targets||{}) };
    merged.targets.cal = 3800; merged.targets.protein = 200; merged.targets.fat = 160; merged.targets.carbs = 400;
    return migrateFoodLogs(merged);
  } catch { return defaultData(); }
}

function plannedDay(dateStr) {

async function openScanner() {
  const sheet = document.getElementById("scanSheet");
  sheet.classList.add("open");
  document.getElementById("scanStatus").textContent = "";
  document.getElementById("scanResult").innerHTML = "";
  document.getElementById("scanCode").value = "";
  const video = document.getElementById("scanVideo");
  try {
    state.scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    video.srcObject = state.scanStream;
    await video.play();
    if ("BarcodeDetector" in window) {
      const det = new BarcodeDetector({ formats: ["ean_13","ean_8","upc_a","upc_e","code_128"] });
      const loop = async () => {
        if (!document.getElementById("scanSheet").classList.contains("open")) return;
        try {
          const codes = await det.detect(video);
          if (codes && codes[0]) {
            document.getElementById("scanCode").value = codes[0].rawValue;
            lookupBarcode(codes[0].rawValue);
            return;
          }
        } catch {}
        requestAnimationFrame(loop);
      };
      loop();
    } else {
      document.getElementById("scanStatus").textContent = "Live scan needs Safari 17+/Chrome. Type the barcode instead.";
    }
  } catch {
    document.getElementById("scanStatus").textContent = "Camera blocked. Type the barcode.";
  }
}
function closeScanner() {
  document.getElementById("scanSheet").classList.remove("open");
  if (state.scanStream) {
    state.scanStream.getTracks().forEach(t => t.stop());
    state.scanStream = null;
  }
  const video = document.getElementById("scanVideo");
  if (video) video.srcObject = null;
}
function findFoodByBarcode(code) {
  const id = (state.data.barcodes||{})[code];
  if (id) return state.data.foods.find(f => f.id === id);
  return state.data.foods.find(f => f.barcode === code);
}
async function lookupBarcode(code) {
  code = String(code||"").replace(/\s+/g,"");
  if (!code) return;
  const status = document.getElementById("scanStatus");
  const box = document.getElementById("scanResult");
  status.textContent = "Looking up " + code + "…";
  const known = findFoodByBarcode(code);
  if (known) {
    status.textContent = "In your library.";
    renderScanHit(known, code);
    return;
  }
  try {
    const res = await fetch("https://world.openfoodfacts.org/api/v0/product/" + encodeURIComponent(code) + ".json");
    const data = await res.json();
    if (data.status !== 1 || !data.product) throw new Error("not found");
    const p = data.product;
    const n = p.nutriments || {};
    const perG = n["energy-kcal_100g"] != null;
    const food = {
      name: p.product_name || p.generic_name || "Scanned item",
      cal: perG ? Number(n["energy-kcal_100g"]||0)/100 : Number(n["energy-kcal_serving"]||0),
      p: perG ? Number(n.proteins_100g||0)/100 : Number(n.proteins_serving||0),
      c: perG ? Number(n.carbohydrates_100g||0)/100 : Number(n.carbohydrates_serving||0),
      f: perG ? Number(n.fat_100g||0)/100 : Number(n.fat_serving||0),
      unit: perG ? "g" : "each",
      serving: perG ? "1 g" : (p.serving_size || "1 serving"),
      barcode: code
    };
    status.textContent = "From Open Food Facts.";
    renderScanHit(food, code, true);
  } catch {
    status.textContent = "No match. Save it as a custom food with this barcode.";
    box.innerHTML = `<button id="scanCustom" class="mt-2 w-full bg-paper-100 text-field-950 font-semibold rounded-xl py-2">Add custom with ${code}</button>`;
    document.getElementById("scanCustom").onclick = () => {
      closeScanner();
      state._pendingBarcode = code;
      showTab("food");
    };
  }
}
function renderScanHit(food, code, isNew) {
  const box = document.getElementById("scanResult");
  const qty = food.unit === "g" || food.unit === "ml" ? 100 : 1;
  box.innerHTML = `
    <div class="rounded-xl border border-field-600 p-3">
      <p class="font-stencil uppercase tracking-wider">${food.name}</p>
      <p class="text-xs text-field-400 font-mono mt-1">${Math.round((food.cal||0)*qty)} kcal · ${((food.p||0)*qty).toFixed(1)}p per ${qty} ${food.unit==="each"?"item":food.unit}</p>
      <div class="flex gap-2 mt-3">
        <input id="scanQty" type="number" value="${qty}" class="w-20 field-input px-2 py-2" />
        <button id="scanAdd" class="flex-1 bg-brass text-field-950 font-semibold rounded-lg">Add to ${mealLabel(state.activeMeal)}</button>
      </div>
    </div>`;
  document.getElementById("scanAdd").onclick = () => {
    let f = findFoodByBarcode(code);
    if (!f) {

    addFoodToDay(state.selectedDate, f.id, Number(document.getElementById("scanQty").value)||qty, state.activeMeal);
    closeScanner();
    showTab(state.tab);
  };
}
function shiftTemplate(dir) {
  const t = state.data.weekTemplate;
  const next = {};
  for (let i=0;i<7;i++) next[i] = t[(i - dir + 7) % 7];
  state.data.weekTemplate = next;

function pushWorkoutsAfterRest(startDate) {
  const original = plannedDay(startDate);
  if (original === "rest") return false;
  const chain = [{ date: startDate, plan: original }];
  let d = addDays(startDate, 1);
  for (let i = 0; i < 400; i++) {
    const plan = plannedDay(d);
    chain.push({ date: d, plan });
    if (plan === "rest") break;
    d = addDays(d, 1);
  }
  state.data.overrides[chain[0].date] = "rest";
  for (let i = 1; i < chain.length; i++) {
    state.data.overrides[chain[i].date] = chain[i - 1].plan;
  }
  scheduleSave();
  return true;
}

function lastLogForExercise(name, beforeDate) {
  const dates = Object.keys(state.data.logs).filter(d => d < beforeDate).sort().reverse();
  for (const d of dates) {
    const sets = state.data.logs[d]?.exercises?.[name];
    if (sets && sets.some(s => s.w || s.r)) return { date:d, sets };
  }
  return null;
}
function bestWeight(sets) {
  if (!sets || !sets.length) return 0;
  return Math.max(...sets.map(s => Number(s.w)||0));
}

function foodTotals(dateStr) {
  const items = state.data.foodLogs[dateStr] || [];
  return items.reduce((a,it) => {
    const f = state.data.foods.find(x => x.id === it.id);
    const q = Number(it.qty)||0;
    if (!f) return a;
    a.cal += f.cal*q; a.p += f.p*q; a.c += (f.c||0)*q; a.f += (f.f||0)*q;
    return a;
  }, { cal:0, p:0, c:0, f:0 });
}
function mealTotals(dateStr, meal) {
  const items = (state.data.foodLogs[dateStr] || []).filter(it => normalizeMeal(it.meal) === meal);
  return items.reduce((a,it) => {
    const f = state.data.foods.find(x => x.id === it.id);
    const q = Number(it.qty)||0;
    if (!f) return a;
    a.cal += f.cal*q; a.p += f.p*q; a.c += (f.c||0)*q; a.f += (f.f||0)*q;
    a.names.push(f.name);
    return a;
  }, { cal:0, p:0, c:0, f:0, names:[] });
}

function setSyncStatus(extra) {
  const el = document.getElementById("headerSub");
  if (!el) return;
  if (extra) { el.textContent = extra; return; }
  if (!state.data?.firebaseConfig?.apiKey) {
    el.textContent = "Local only · not synced";
    return;
  }
  if (!state.firebase.uid) {
    el.textContent = "Cloud ready · sign in (menu)";
    return;
  }
  const when = state.lastSync ? new Date(state.lastSync).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}) : "just now";
  el.textContent = `Cloud synced · ${when}`;
}

function initFirebaseIfConfigured() {
  const cfg = state.data.firebaseConfig;
  if (!cfg || !cfg.apiKey) { setSyncStatus(); return; }
  try {
    if (!firebase.apps.length) state.firebase.app = firebase.initializeApp(cfg);
    else state.firebase.app = firebase.app();
    state.firebase.auth = firebase.auth();
    state.firebase.db = firebase.firestore();
    state.firebase.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
    state.firebase.ready = true;
    setSyncStatus("Cloud ready · sign in (menu)");
    state.firebase.auth.getRedirectResult().catch(e => {
      if (e && e.code) setSyncStatus(e.code + ": " + e.message);
    });
    state.firebase.auth.onAuthStateChanged(async (user) => {
      if (!user) { state.firebase.uid = null; setSyncStatus(); render(); return; }
      state.firebase.uid = user.uid;
      setSyncStatus("Syncing…");
      await pullCloud();
      state.lastSync = Date.now();
      setSyncStatus();
      render();
    });
  } catch (e) { setSyncStatus("Firebase error: " + e.message); }
}

async function pullCloud() {
  if (!state.firebase.uid) return;
  const snap = await state.firebase.db.collection("users").doc(state.firebase.uid).get();
  if (snap.exists && snap.data().payload) {
    const keepCfg = state.data.firebaseConfig;
    state.data = migrateFoodLogs({ ...defaultData(), ...snap.data().payload, firebaseConfig: keepCfg });
    if (!state.data.foods || state.data.foods.length < 20) state.data.foods = DEFAULT_FOODS;
    const banned = new Set(["chipotle","subway","frozen_yogurt","grilled_cheese","hash_brown","grape_crush","vanilla_chai","frannies"]);
    state.data.foods = state.data.foods.filter(f => !banned.has(f.id));
    state.data.targets = { cal:3800, protein:200, fat:160, carbs:400 };
    saveLocal();
  } else await pushCloud();
}
async function pushCloud() {
  if (!state.firebase.uid) return;
  const payload = { ...state.data }; delete payload.firebaseConfig;
  try {
    await state.firebase.db.collection("users").doc(state.firebase.uid).set({
      payload, updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge:true });
    state.lastSync = Date.now();
    setSyncStatus();
  } catch (e) { setSyncStatus("Sync failed · data still local"); }
}
async function signInGoogle() {
  if (!state.firebase.ready) return alert("Paste a valid Firebase config first.");
  const provider = new firebase.auth.GoogleAuthProvider();
  setSyncStatus("Opening Google…");
  try {
    await state.firebase.auth.signInWithPopup(provider);
  } catch (e1) {
    try {
      await state.firebase.auth.signInWithRedirect(provider);
    } catch (e) {
      setSyncStatus((e.code || e1.code || "signin") + ": " + (e.message || e1.message || e));
      alert((e.code || e1.code || "Sign-in error") + "\n\n" + (e.message || e1.message || e));
    }
  }
}
async function signInEmail(create) {
  if (!state.firebase.ready) return alert("Paste a valid Firebase config first.");
  const email = (document.getElementById("authEmail")||{}).value?.trim();
  const pass = (document.getElementById("authPass")||{}).value;
  if (!email || !pass) return alert("Enter email and password.");
  try {
    if (create) await state.firebase.auth.createUserWithEmailAndPassword(email, pass);

  } catch (e) {
    setSyncStatus((e.code || "auth") + ": " + e.message);
    alert((e.code || "Auth error") + "\n\n" + e.message);
  }

    f: Math.max(0, (t.fat||0) - tot.f),

  };

function foodKind(f) {
  const n = (f.name||"").toLowerCase();
  const p100 = (f.unit==="each") ? (f.p||0) : (f.p||0)*100;
  const c100 = (f.unit==="each") ? (f.c||0) : (f.c||0)*100;
  const fat100 = (f.unit==="each") ? (f.f||0) : (f.f||0)*100;
  if (/cheese|curd|brie|ranch|margarine|sour cream|avocado/.test(n)) return "fat";
  if (/rice|potato|fries|bagel|bread|naan|pasta|oatmeal|cereal|banana|cracker|hummus|pizza|chip/.test(n)) return "carb";
  if (p100 >= 15 && c100 < 15) return "protein";
  if (c100 >= 15 && p100 < 12) return "carb";
  if (fat100 >= 15 && p100 < 12) return "fat";
  return "mixed";
}
function saneQty(f) {
  const n = (f.name||"").toLowerCase();
  if (f.unit==="each") return 1;
  if (/cheese|curd|brie|ranch|margarine|sour cream/.test(n)) return 30;
  if (/avocado/.test(n)) return 80;
  if (/chicken|beef|steak|shrimp|turkey|meat|thigh|breast|wing/.test(n)) return 180;
  if (/rice|potato|broccoli|yogurt|milk|blueberr/.test(n)) return 150;
  if (/protein powder/.test(n)) return 1;
  return 100;
}
function suggestFoods(dateStr, limit) {
  const left0 = leftovers(dateStr);
  let needCal = left0.cal, needP = left0.p, needC = left0.c, needF = left0.f;
  const used = new Set();
  const plate = [];
  const want = ["protein","carb","protein","carb","fat"];
  const pick = (kind) => {
    let best = null;
    (state.data.foods||[]).forEach(f => {
      if (used.has(f.id)) return;
      if (kind && foodKind(f) !== kind && foodKind(f) !== "mixed") return;
      const measured = f.unit==="g" || f.unit==="ml";
      let qty = saneQty(f);
      const cal = f.cal*qty;
      if (cal < 20) return;
      if (needCal < 180 && cal > needCal + 80) return;
      if (cal > Math.max(needCal, 250) + 200) return;
      const p = f.p*qty, c=(f.c||0)*qty, fat=(f.f||0)*qty;
      const score =
        Math.min(p, Math.max(needP, 8)) * 2.2 +
        Math.min(c, Math.max(needC, 8)) * 1.1 +
        Math.min(fat, Math.max(needF, 5)) * 0.8 -
        Math.max(0, cal - needCal) * 0.6 -
        Math.max(0, fat - Math.max(needF, 20)) * 1.4;
      if (!best || score > best.score) best = { f, qty, cal, p, c, fat, score, unit: measured ? f.unit : "qty" };
    });
    return best;
  };
  want.slice(0, limit||4).forEach(kind => {
    if (needCal < 120 && needP < 15) return;
    const item = pick(kind) || pick(null);
    if (!item) return;
    used.add(item.f.id);
    plate.push(item);
    needCal -= item.cal; needP -= item.p; needC -= item.c; needF -= item.fat;
  });
  return plate;
}
function weekSessionCounts() {
  const start = weekStart(state.selectedDate);
  const s = parseISO(start);
  const counts = { day1:0, day2:0, day3:0, day4:0, day5:0 };
  for (let i=0;i<7;i++) {
    const dt = isoDate(new Date(s.getFullYear(), s.getMonth(), s.getDate()+i));
    const pid = plannedDay(dt);
    if (hasLiftLog(dt) && counts[pid]!=null) counts[pid]++;
  }
  return counts;
}
function prsFor(name) {
  let best = 0, date = "";
  Object.keys(state.data.logs||{}).forEach(d => {
    const w = bestWeight(state.data.logs[d].exercises?.[name]);
    if (w > best) { best = w; date = d; }
  });
  return { best, date };
}

function coachTips(dateStr) {
  const tips = [];
  const pid = plannedDay(dateStr);
  const prog = PROGRAM[pid] || PROGRAM.rest;
  const left = leftovers(dateStr);
  const sl = state.data.sleep[dateStr] || {};
  const hour = new Date().getHours();
  const trained = hasLiftLog(dateStr);
  const eaten = (state.data.foodLogs[dateStr]||[]).length;

  if (sl.hours && sl.hours < 6 && pid !== "rest")
    tips.push("Sleep was under 6 hours. Keep the session, but don’t chase a squat/RDL PR — last weight is enough.");
  else if (sl.quality === "poor" && pid !== "rest")
    tips.push("Sleep quality was poor. Cap the main lift at last time’s top set.");
  else if (sl.hours >= 8 && sl.quality === "good" && pid !== "rest")
    tips.push("You’re recovered. Add 5 lb on the first compound if last time felt easy.");

  if (pid === "rest")
    tips.push("Rest day: walk, hit calories, creatine. No guilt if you skip the gym.");
  else if (!trained)
    tips.push("Today is " + prog.short + " at Movati. Start with " + (prog.exercises[0]||"the first lift") + ".");
  else
    tips.push(prog.short + " is logged. If a lift moved, that’s the win — don’t add junk volume.");

  if (left.p > 40)
    tips.push("Protein is short by " + Math.round(left.p) + " g. Chicken breast, shrimp, or a protein scoop before more snacks.");
  else if (left.p <= 10 && left.cal > 400)
    tips.push("Protein is basically done. Fill remaining calories with rice, bagel, fruit — not more cheese.");

  if (left.cal > 1200 && hour >= 18)
    tips.push("You still have " + Math.round(left.cal) + " kcal left and it’s late. A real meal (meat + rice or bagel + eggs), not grazing.");
  else if (left.cal < 150 && eaten)
    tips.push("You’re on target. Stop unless you’re actually hungry.");

  if (!eaten && hour >= 12)
    tips.push("No food logged yet. Log breakfast even if it was hours ago so Eat next is honest.");

  const yest = addDays(dateStr, -1);
  const yPlan = plannedDay(yest);
  if (yPlan !== "rest" && !hasLiftLog(yest))
    tips.push("You skipped " + (PROGRAM[yPlan]||{}).short + " yesterday. Do it as Extra today or let it go — don’t stack two hard lower-body days.");

  const supp = state.data.supplements[dateStr] || {};
  if (!supp.creatine) tips.push("Creatine isn’t checked. Take it even on rest days.");

  return tips.slice(0, 5);
}

function drawMacroDonut(tot, t) {
  const el = document.getElementById("macroDonut");
  if (!el || typeof Chart === "undefined") return;
  if (state.charts.macro) { try { state.charts.macro.destroy(); } catch {} }
  const p = Math.max(0, tot.p);
  const c = Math.max(0, tot.c);
  const f = Math.max(0, tot.f);
  const remain = Math.max(0, (t.cal||0) - (tot.cal||0));
  state.charts.macro = new Chart(el, {
    type: "doughnut",
    data: {
      labels: ["Protein","Carbs","Fats","Left"],
      datasets: [{
        data: [p*4, c*4, f*9, remain],
        backgroundColor: ["#e06a3a","#c4a574","#8a7e70","#3a3a3a"],
        borderWidth: 0,
        hoverOffset: 0
      }]
    },
    options: {
      cutout: "72%",
      plugins: { legend: { display: false }, tooltip: { enabled: false } },
      animation: { duration: 400 }
    }
  });
}

function prettyDate(dateStr) {
  return parseISO(dateStr).toLocaleDateString(undefined, { weekday:"long", month:"short", day:"numeric" });
}
function prettyDateStamp(dateStr) {
  return parseISO(dateStr).toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric" }).toUpperCase();
}
function hasLiftLog(dateStr) {
  const ex = state.data.logs[dateStr]?.exercises;
  return !!ex && Object.values(ex).some(s => s.some(x => x.w || x.r));
}

function ensureLog(dateStr) {
  if (!state.data.logs[dateStr]) state.data.logs[dateStr] = { programDay: plannedDay(dateStr), exercises: {}, notes: "" };
  if (state.data.logs[dateStr].notes == null) state.data.logs[dateStr].notes = "";
  return state.data.logs[dateStr];
}

function renderWorkout() {
  const root = document.getElementById("view-workout");
  const dateStr = state.selectedDate;
  const pid = plannedDay(dateStr);
  const prog = PROGRAM[pid] || PROGRAM.rest;
  const log = ensureLog(dateStr);
  log.programDay = pid;
  const bw = state.data.bodyweight[dateStr] ?? "";
  const supp = state.data.supplements[dateStr] || { creatine:false, omega:false, vitd:false };

  let html = `
    <div class="flex items-center justify-between mb-3">
      <div>
        <p class="text-xs text-brass uppercase tracking-widest">${prettyDateStamp(dateStr)}</p>
        <h2 class="stamp text-3xl">${prog.name}</h2>
      </div>
      <input type="date" id="logDate" value="${dateStr}" class="field-input px-2 py-1 text-sm" />
    </div>
    <textarea id="notes" rows="2" class="w-full field-input rounded-2xl px-3 py-2 mb-3 text-sm" placeholder="Session notes (sleep, shoulder, pump… )">${log.notes||""}</textarea>
  `;

  if (pid === "rest") {
    html += `<p class="text-field-400 mb-6">Rest day. Change it on History if you want to train.</p>`;
    root.innerHTML = html; bindWorkoutHeader(root); return;
  }

  const exercises = pid === "extra" ? Object.keys(log.exercises) : prog.exercises;
  if (pid === "extra") {
    html += `<div class="flex gap-2 mb-3"><input id="customEx" class="flex-1 field-input px-3 py-2" placeholder="Add exercise"/><button id="addEx" class="bg-brass text-field-950 font-semibold px-3 rounded-lg">Add</button></div>`;
  }

  exercises.forEach(name => {
    if (!log.exercises[name]) log.exercises[name] = [{w:"",r:""},{w:"",r:""},{w:"",r:""}];
    const prev = lastLogForExercise(name, dateStr);
    const prevTxt = prev ? prev.sets.filter(s=>s.w||s.r).map(s => `${s.w||"-"}×${s.r||"-"}`).join("  ") : "no previous";
    const prev1 = prev ? Math.round(bestSet1RM(prev.sets)) : 0;
    html += `<div class="rounded-2xl border border-field-600 bg-field-800 p-3 mb-3" data-ex="${encodeURIComponent(name)}">
      <div class="flex justify-between gap-2 items-start">
        <h3 class="font-medium">${name}</h3>
        <div class="flex gap-2">
          ${prev ? `<button class="uselast text-xs bg-field-700 px-2 py-1 rounded-lg">Last</button>
          <button class="plus5 text-xs bg-field-700 px-2 py-1 rounded-lg">+5 lb</button>` : ""}
          <button class="addset text-xs text-brass py-1">+ set</button>
        </div>
      </div>
      <p class="text-[11px] text-field-400 mt-1 font-mono">Last${prev?" ("+prev.date+")":""}: ${prevTxt}${prev1?` · est 1RM ${prev1} lb`:""}</p>
      <div class="sets mt-2 space-y-2">${log.exercises[name].map((s,i)=>setRow(s,i)).join("")}</div>
    </div>`;
  });

  html += `<button id="saveWorkout" class="w-full bg-brass text-field-950 font-semibold rounded-xl py-3 mb-6 uppercase tracking-wider">Save workout</button>`;
  root.innerHTML = html;
  bindWorkoutHeader(root);

  root.querySelectorAll("[data-ex]").forEach(card => {
    const name = decodeURIComponent(card.dataset.ex);
    card.querySelector(".addset").onclick = () => { log.exercises[name].push({w:"",r:""}); scheduleSave(); renderWorkout(); };
    const ul = card.querySelector(".uselast");
    if (ul) ul.onclick = () => {
      const prev = lastLogForExercise(name, dateStr);
      if (!prev) return;
      log.exercises[name] = prev.sets.map(s => ({ w:s.w, r:s.r }));
      scheduleSave(); renderWorkout();
    };
    const p5 = card.querySelector(".plus5");
    if (p5) p5.onclick = () => {
      const prev = lastLogForExercise(name, dateStr);
      if (!prev) return;
      log.exercises[name] = prev.sets.map(s => ({ w: s.w ? Number(s.w)+5 : "", r:s.r }));
      scheduleSave(); renderWorkout();
    };
    card.querySelectorAll(".setw").forEach(inp => inp.oninput = () => { log.exercises[name][Number(inp.dataset.i)].w = inp.value; scheduleSave(); });
    card.querySelectorAll(".setr").forEach(inp => inp.oninput = () => { log.exercises[name][Number(inp.dataset.i)].r = inp.value; scheduleSave(); });
  });
  const addEx = root.querySelector("#addEx");
  if (addEx) addEx.onclick = () => {
    const n = root.querySelector("#customEx").value.trim(); if (!n) return;
    log.exercises[n] = [{w:"",r:""}]; scheduleSave(); renderWorkout();
  };
  root.querySelector("#saveWorkout").onclick = () => { scheduleSave(); alert("Saved"); };
}

function setRow(s,i) {
  return `<div class="grid grid-cols-[2rem_1fr_1fr] gap-2 items-center">
    <span class="text-xs text-field-400">${i+1}</span>
    <input class="setw lift-in field-input px-3 py-2" data-i="${i}" type="number" step="0.5" placeholder="lb" value="${s.w??""}" />
    <input class="setr lift-in field-input px-3 py-2" data-i="${i}" type="number" step="1" placeholder="reps" value="${s.r??""}" />
  </div>`;
}

function bindWorkoutHeader(root) {
  root.querySelector("#logDate").onchange = e => { state.selectedDate = e.target.value; renderWorkout(); refreshDateAlert(); syncRail(); };
  root.querySelector("#notes").oninput = e => { ensureLog(state.selectedDate).notes = e.target.value; scheduleSave(); };
  refreshDateAlert();
  syncRail();
}

function allExerciseNames() {
  const set = new Set();
  Object.values(PROGRAM).forEach(p => p.exercises.forEach(e => set.add(e)));
  Object.values(state.data.logs).forEach(l => Object.keys(l.exercises||{}).forEach(e => set.add(e)));
  return [...set];
}

function weekStart(dateStr) {
  const d = parseISO(dateStr);
  d.setDate(d.getDate() - d.getDay());
  return isoDate(d);
}
function weeklyVolume(anchor) {
  const start = weekStart(anchor);
  const s = parseISO(start);
  let total = 0;
  const byDay = {};
  for (let i=0;i<7;i++) {
    const dt = isoDate(new Date(s.getFullYear(), s.getMonth(), s.getDate()+i));
    const log = state.data.logs[dt];
    let v = 0;
    if (log?.exercises) Object.values(log.exercises).forEach(sets => v += setVolume(sets));
    byDay[dt] = v; total += v;
  }
  return { start, total, byDay };
}

    type:"line",
    data:{ labels: bwDates.map(d=>d.slice(5)), datasets:[{ data: bwDates.map(d=>state.data.bodyweight[d]), borderColor:"#efe6d6", tension:.25 }] },
    options:{ plugins:{legend:{display:false}}, scales:{ y:{ ticks:{color:"#9a9388"} }, x:{ ticks:{color:"#9a9388"} } } }
  });
  box.querySelector("#progTable").innerHTML = `<h3 class="font-medium mb-2">Recent ${current}</h3>` +
    (liftPts.slice(-16).reverse().map(p => `<div class="flex justify-between py-1 border-b border-field-700"><span class="text-field-400">${p.x}</span><span>${p.best} lb · 1RM ${p.y}</span></div>`).join("") || "<p class='text-field-400'>No logs yet.</p>");
}

function renderFoodProgress(box) {
  const dates = Object.keys(state.data.foodLogs).filter(d => (state.data.foodLogs[d]||[]).length).sort();
  const rows = dates.map(d => ({ d, ...foodTotals(d) }));
  const avg = rows.reduce((a,r)=>({ cal:a.cal+r.cal, p:a.p+r.p, c:a.c+r.c, f:a.f+r.f }), {cal:0,p:0,c:0,f:0});
  if (rows.length) { avg.cal/=rows.length; avg.p/=rows.length; avg.c/=rows.length; avg.f/=rows.length; }
  else { avg.cal=avg.p=avg.c=avg.f=0; }

  const last30 = rows.slice(-30);
  box.innerHTML = `
    <div class="grid grid-cols-2 gap-2 mb-3">
      <div class="rounded-2xl bg-field-800 border border-field-600 p-3"><p class="text-xs text-field-400">Avg calories</p><p class="text-xl font-semibold">${Math.round(avg.cal)}</p></div>
      <div class="rounded-2xl bg-field-800 border border-field-600 p-3"><p class="text-xs text-field-400">Avg protein</p><p class="text-xl font-semibold">${Math.round(avg.p)}g</p></div>
      <div class="rounded-2xl bg-field-800 border border-field-600 p-3"><p class="text-xs text-field-400">Avg fat</p><p class="text-xl font-semibold">${Math.round(avg.f)}g</p></div>
      <div class="rounded-2xl bg-field-800 border border-field-600 p-3"><p class="text-xs text-field-400">Avg carbs</p><p class="text-xl font-semibold">${Math.round(avg.c)}g</p></div>
    </div>
    <div class="rounded-2xl border border-field-600 bg-field-800 p-3 mb-3"><canvas id="foodChart" height="170"></canvas></div>
    <h3 class="font-medium mb-2">Each day</h3>
    <div class="text-sm mb-8">${rows.slice().reverse().map(r => `
      <div class="flex justify-between gap-2 py-1.5 border-b border-field-700">
        <span class="text-field-400">${r.d}</span>
        <span class="font-mono">${Math.round(r.cal)} · ${Math.round(r.p)}p · ${Math.round(r.c)}c · ${Math.round(r.f)}f</span>
      </div>`).join("") || "<p class='text-field-400'>No food logs yet.</p>"}</div>
  `;
  destroyCharts(["macro"]);
  state.charts.food = new Chart(document.getElementById("foodChart"), {
    type:"line",
    data:{
      labels: last30.map(r=>r.d.slice(5)),
      datasets:[
        { label:"kcal", data:last30.map(r=>Math.round(r.cal)), borderColor:"#e06a3a", yAxisID:"y", tension:.2 },
        { label:"protein", data:last30.map(r=>Math.round(r.p)), borderColor:"#c4a574", yAxisID:"y1", tension:.2 }
      ]
    },
    options:{
      plugins:{ legend:{ labels:{ color:"#9a9388" } } },
      scales:{
        y:{ ticks:{color:"#9a9388"}, title:{display:true,text:"kcal",color:"#9a9388"} },
        y1:{ position:"right", grid:{drawOnChartArea:false}, ticks:{color:"#9a9388"} },
        x:{ ticks:{color:"#9a9388"} }
      }
    }
  });
}

function destroyCharts(keep) {
  const hold = new Set(keep || []);
  Object.entries(state.charts).forEach(([k,c]) => {
    if (hold.has(k)) return;
    try { c.destroy(); } catch {}
    delete state.charts[k];
  });
}
const PINNED_IDS = ["chicken_breast","cooked_rice","bagel","protein_powder","eggs","banana","steak","yogurt"];
function showFoodInfo(id) {
  const f = state.data.foods.find(x => x.id === id);
  if (!f) return;
  const whole = f.unit === "each";
  const qty = whole ? 1 : 100;
  const label = whole ? (f.serving || "1 serving") : ("per 100 " + (f.unit || "g"));
  const n = (x) => Math.round((x || 0) * qty * 10) / 10;
  document.getElementById("sheetName").textContent = f.name;
  document.getElementById("sheetSub").textContent = label;
  document.getElementById("sheetMacros").innerHTML = [
    ["Calories", Math.round(f.cal * qty) + " kcal"],
    ["Protein", n(f.p) + " g"],
    ["Carbs", n(f.c) + " g"],
    ["Fat", n(f.f) + " g"]
  ].map(([k,v]) => `<div class="rounded-xl bg-black/10 p-3"><p class="text-xs text-ink-500">${k}</p><p class="text-lg font-semibold">${v}</p></div>`).join("");
  document.getElementById("foodSheet").classList.add("open");
}
function foodDay(dateStr) {
  if (!state.data.foodLogs[dateStr]) state.data.foodLogs[dateStr] = [];
  state.data.foodLogs[dateStr].forEach(it => { if (!it.meal) it.meal = "meal1"; });
  return state.data.foodLogs[dateStr];
}

function renderFood() {
  const root = document.getElementById("view-food");
  const dateStr = state.selectedDate;
  const items = foodDay(dateStr);
  const totals = foodTotals(dateStr);
  const t = state.data.targets;
  const supp = state.data.supplements[dateStr] || { creatine:false, omega:false, vitd:false };
  const meal = state.activeMeal || defaultMealId();

  root.innerHTML = `
    <div class="flex items-center justify-between mb-3">
      <h2 class="stamp text-3xl">Food</h2>
      <div class="flex gap-2">
        <button id="scanOpenFood" class="text-xs bg-field-700 px-3 py-1.5 rounded-full uppercase tracking-wider">Scan</button>
        <input type="date" id="foodDate" value="${dateStr}" class="field-input px-2 py-1 text-sm" />
      </div>
    </div>
    <div class="paper rounded-2xl p-3 mb-3 grid grid-cols-2 gap-2">
      <div><p class="text-[10px] uppercase tracking-widest text-ink-500">Calories</p><p class="text-xl font-stencil">${Math.round(totals.cal)} <span class="text-xs text-ink-500">/ ${t.cal}</span></p></div>
      <div><p class="text-[10px] uppercase tracking-widest text-ink-500">Protein</p><p class="text-xl font-stencil">${Math.round(totals.p)}g <span class="text-xs text-ink-500">/ ${t.protein}g</span></p></div>
      <div><p class="text-[10px] uppercase tracking-widest text-ink-500">Fat</p><p class="text-xl font-stencil">${Math.round(totals.f)}g <span class="text-xs text-ink-500">/ ${t.fat||0}g</span></p></div>
      <div><p class="text-[10px] uppercase tracking-widest text-ink-500">Carbs</p><p class="text-xl font-stencil">${Math.round(totals.c)}g <span class="text-xs text-ink-500">/ ${t.carbs||0}g</span></p></div>
    </div>
    <div class="flex gap-1.5 mb-3 overflow-x-auto">
      ${meals().map(m => `<button data-setmeal="${m.id}" class="shrink-0 text-[11px] uppercase tracking-wider px-3 py-1.5 rounded-full ${meal===m.id?"bg-brass text-field-950":"bg-field-800 text-paper-200 border border-field-600"}">${m.label}</button>`).join("")}
      <button id="addMealLib" class="shrink-0 text-[11px] uppercase tracking-wider px-3 py-1.5 rounded-full border border-dashed border-field-500 text-field-400">+ Meal</button>
    </div>
    <input id="foodSearch" class="w-full field-input rounded-xl px-3 py-2 mb-3" placeholder="Search foods..." />
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
      <div>
        <h3 class="font-medium mb-2">By gram / ml</h3>
        <div id="foodGram" class="space-y-2 max-h-80 overflow-y-auto pr-1"></div>
      </div>
      <div>
        <h3 class="font-medium mb-2">Whole items</h3>
        <div id="foodWhole" class="space-y-2 max-h-80 overflow-y-auto pr-1"></div>
      </div>
    </div>
    <h3 class="font-medium mb-2 uppercase tracking-wider text-sm">Logged · ${mealLabel(meal)}</h3>
    <div id="foodLogged" class="space-y-2 mb-4"></div>
    <h3 class="font-medium mb-2 uppercase tracking-wider text-sm">All meals</h3>
    <div class="paper rounded-2xl p-3 mb-6 text-sm">
      ${meals().map(m => {
        const mt = mealTotals(dateStr, m.id);
        return `<div class="flex justify-between py-1.5 meal-row"><span class="uppercase tracking-wider">${m.label}</span><span class="font-mono">${mt.cal?Math.round(mt.cal)+" kcal · "+Math.round(mt.p)+"p":"—"}</span></div>`;
      }).join("")}
    </div>
    <div class="rounded-2xl border border-field-600 bg-field-800 p-3 mb-8">
      <h3 class="font-medium mb-2">Add custom food</h3>
      <div class="grid grid-cols-2 gap-2">
        <input id="nfName" class="col-span-2 field-input px-3 py-2" placeholder="Name" />
        <input id="nfCal" type="number" class="field-input px-3 py-2" placeholder="Calories per unit" />
        <input id="nfP" type="number" class="field-input px-3 py-2" placeholder="Protein g" />
        <input id="nfC" type="number" class="field-input px-3 py-2" placeholder="Carbs g" />
        <input id="nfF" type="number" class="field-input px-3 py-2" placeholder="Fat g" />
        <select id="nfUnit" class="field-input px-3 py-2"><option value="g">per gram</option><option value="ml">per ml</option><option value="each">per item</option></select>
        <input id="nfServ" class="field-input px-3 py-2" placeholder="Label (1 g / 1 scoop)" />
      </div>
      <button id="saveFood" class="mt-3 w-full bg-paper-100 text-field-950 font-semibold rounded-xl py-2">Save to library</button>
    </div>
  `;

  const foodRow = (f) => {
    const measured = f.unit === "g" || f.unit === "ml";
    const defQty = measured ? 100 : 1;
    return `<div class="flex items-center gap-2 bg-field-800 border border-field-600 rounded-xl px-3 py-2">
      <button type="button" data-info="${f.id}" class="flex-1 min-w-0 text-left">
        <p class="text-sm truncate">${f.name}</p>
        <p class="text-[11px] text-field-400">${measured ? `${Math.round(f.cal*100)} kcal / 100 ${f.unit}` : `${f.cal} kcal each`}</p>
      </button>
      <input data-qtyfor="${f.id}" type="number" step="${measured?1:0.5}" value="${defQty}" class="w-16 field-input px-2 py-1 text-sm" />
      <span class="text-[11px] text-field-400 w-7">${f.unit==="each"?"qty":f.unit}</span>
      <button data-add="${f.id}" class="text-sm bg-brass text-field-950 font-semibold px-3 py-1 rounded-lg">Add</button>
      <button data-removelib="${f.id}" class="text-field-400 text-sm px-1">✕</button>
    </div>`;
  };
  const drawResults = (q="") => {
    const needle = q.toLowerCase();
    const match = (f) => f.name.toLowerCase().includes(needle);
    const gram = state.data.foods.filter(f => (f.unit==="g"||f.unit==="ml") && match(f)).sort((a,b)=>a.name.localeCompare(b.name));
    const whole = state.data.foods.filter(f => f.unit==="each" && match(f)).sort((a,b)=>a.name.localeCompare(b.name));
    const gramBox = root.querySelector("#foodGram");
    const wholeBox = root.querySelector("#foodWhole");
    gramBox.innerHTML = gram.map(foodRow).join("") || `<p class="text-field-400 text-sm">No matches.</p>`;
    wholeBox.innerHTML = whole.map(foodRow).join("") || `<p class="text-field-400 text-sm">No matches.</p>`;
    root.querySelectorAll("[data-add]").forEach(b => b.onclick = () => {
      const qtyInp = root.querySelector(`[data-qtyfor="${b.dataset.add}"]`);
      const qty = Number(qtyInp?.value) || 1;
      addFoodToDay(dateStr, b.dataset.add, qty, meal);
      renderFood();
    });
    root.querySelectorAll("[data-removelib]").forEach(b => b.onclick = () => {
      if (!confirm("Remove this food from your library?")) return;
      state.data.foods = state.data.foods.filter(x => x.id !== b.dataset.removelib);
      scheduleSave(); renderFood();
    });
    root.querySelectorAll("[data-info]").forEach(b => b.onclick = () => showFoodInfo(b.dataset.info));
  };
  drawResults();
  root.querySelector("#foodSearch").oninput = e => drawResults(e.target.value);
  root.querySelectorAll("[data-setmeal]").forEach(b => b.onclick = () => { state.activeMeal = b.dataset.setmeal; renderFood(); });
  const addMealLib = root.querySelector("#addMealLib");
  if (addMealLib) addMealLib.onclick = () => { addMealSlot(); renderFood(); };

  const mealItems = items.map((it, idx) => ({ it, idx })).filter(x => normalizeMeal(x.it.meal) === meal);
  root.querySelector("#foodLogged").innerHTML = mealItems.map(({it, idx}) => {
    const f = state.data.foods.find(x => x.id === it.id);
    if (!f) return "";
    return `<div class="flex items-center gap-2 bg-field-800 border border-field-600 rounded-xl px-3 py-2">
      <button type="button" data-loggedinfo="${f.id}" class="flex-1 text-left">
        <p class="text-sm">${f.name}</p>
        <p class="text-[11px] text-field-400 font-mono">${Math.round(f.cal*it.qty)} kcal · ${Math.round(f.p*it.qty)}p</p>
      </button>
      <select data-movemeal="${idx}" class="field-input text-[11px] px-1 py-1">
        ${meals().map(m => `<option value="${m.id}" ${normalizeMeal(it.meal)===m.id?"selected":""}>${m.label}</option>`).join("")}
      </select>
      <input data-qty="${idx}" type="number" step="0.1" value="${it.qty}" class="w-16 field-input px-2 py-1 text-sm" />
      <span class="text-[11px] text-field-400">${f.unit==="each"?"qty":f.unit}</span>
      <button data-del="${idx}" class="text-field-400 text-sm">✕</button>
    </div>`;
  }).join("") || `<p class="text-field-400 text-sm">Nothing in ${mealLabel(meal)}.</p>`;

  root.querySelectorAll("[data-qty]").forEach(inp => inp.onchange = () => {
    items[Number(inp.dataset.qty)].qty = Number(inp.value)||0; scheduleSave(); renderFood();
  });
  root.querySelectorAll("[data-movemeal]").forEach(sel => sel.onchange = () => {
    items[Number(sel.dataset.movemeal)].meal = sel.value; scheduleSave(); renderFood();
  });
  root.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { items.splice(Number(b.dataset.del),1); scheduleSave(); renderFood(); });
  root.querySelectorAll("[data-loggedinfo]").forEach(b => b.onclick = () => showFoodInfo(b.dataset.loggedinfo));
  root.querySelector("#foodDate").onchange = e => { state.selectedDate = e.target.value; renderFood(); refreshDateAlert(); syncRail(); };
  const scanFood = root.querySelector("#scanOpenFood");
  if (scanFood) scanFood.onclick = () => openScanner();
  root.querySelector("#saveFood").onclick = () => {
    const name = root.querySelector("#nfName").value.trim(); if (!name) return;
    const unit = root.querySelector("#nfUnit").value;
    state.data.foods.unshift({
      id: "custom_"+Date.now(), name,
      cal: Number(root.querySelector("#nfCal").value)||0,
      p: Number(root.querySelector("#nfP").value)||0,
      c: Number(root.querySelector("#nfC").value)||0,
      f: Number(root.querySelector("#nfF").value)||0,
      unit, serving: root.querySelector("#nfServ").value.trim() || (unit==="each"?"1 item":"1 "+unit)
    });
    scheduleSave(); renderFood();
  };
}

        <button id="saveFb" class="mt-2 w-full bg-brass text-field-950 font-semibold rounded-xl py-2">Save config</button>
      </details>

      <div class="flex gap-2">
        <button id="btnCreate" class="flex-1 bg-field-700 rounded-xl py-2 text-sm">Create account</button>

      </div>
    </div>
    <div class="rounded-2xl border border-field-600 bg-field-800 p-4 mb-8">
      <h3 class="font-medium mb-2">Backup</h3>
      <div class="flex gap-2">
        <button id="exp" class="flex-1 bg-field-700 rounded-xl py-2">Export JSON</button>
        <label class="flex-1 bg-field-700 rounded-xl py-2 text-center cursor-pointer">Import JSON<input id="imp" type="file" accept="application/json" class="hidden" /></label>
      </div>
    </div>
  `;
  root.querySelector("#tCal").onchange = e => { state.data.targets.cal = Number(e.target.value)||0; scheduleSave(); };
  root.querySelector("#tP").onchange = e => { state.data.targets.protein = Number(e.target.value)||0; scheduleSave(); };
  root.querySelector("#tF").onchange = e => { state.data.targets.fat = Number(e.target.value)||0; scheduleSave(); };
  root.querySelector("#tC").onchange = e => { state.data.targets.carbs = Number(e.target.value)||0; scheduleSave(); };
  root.querySelector("#saveFb").onclick = () => {
    try {
      const raw = root.querySelector("#fbCfg").value.trim();
      state.data.firebaseConfig = raw ? JSON.parse(raw) : null;
      saveLocal(); location.reload();
    } catch { alert("Invalid JSON"); }
  };
  root.querySelector("#btnIn").onclick = signInGoogle;
  root.querySelector("#btnOut").onclick = signOut;
  root.querySelector("#btnCreate").onclick = () => signInEmail(true);
  root.querySelector("#btnEmail").onclick = () => signInEmail(false);
  root.querySelector("#exp").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(state.data,null,2)],{type:"application/json"}));
    a.download = "the-logbook-backup.json"; a.click();
  };
  root.querySelector("#imp").onchange = async e => {
    const file = e.target.files[0]; if (!file) return;
    const keep = state.data.firebaseConfig;
    state.data = migrateFoodLogs({ ...defaultData(), ...JSON.parse(await file.text()), firebaseConfig: keep });
    scheduleSave(); render();
  };
}

document.querySelectorAll(".navbtn").forEach(b => b.onclick = () => showTab(b.dataset.tab));

(function installManifest() {
  const manifest = {
    name: "The Logbook",
    short_name: "Logbook",
    display: "standalone",
    start_url: ".",
    background_color: "#efe6d6",
    theme_color: "#141414",
    icons: []
  };
  const url = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" }));
  const link = document.createElement("link");
  link.rel = "manifest";
  link.href = url;
  document.head.appendChild(link);
})();
function hideSplash() {
  const el = document.getElementById("bootSplash");
  if (!el) return;
  requestAnimationFrame(() => {
    el.classList.add("hide");
    setTimeout(() => el.remove(), 500);
  });
}

state.data = loadLocal();
initFirebaseIfConfigured();
setSyncStatus();
bindRail();
render();
setTimeout(hideSplash, 550);
