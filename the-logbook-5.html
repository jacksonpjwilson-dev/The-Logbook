const LS_KEY = "logbook_v3";
const state = {
  tab: "calendar", selectedDate: isoDate(new Date()), calMonth: new Date(),
  data: null, firebase: { app:null, auth:null, db:null, uid:null, ready:false },
  saveTimer: null, charts: {}, lastSync: null, syncState: "local",
  progPane: "lifts", calView: "week"
};

function isoDate(d) {
  const x = new Date(d); x.setHours(0,0,0,0);
  return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;
}
function parseISO(s) { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function weekday(dateStr) { return parseISO(dateStr).getDay(); }
function epley(w,r) { w=Number(w)||0; r=Number(r)||0; if (!w) return 0; if (r<=1) return w; return w*(1+r/30); }
function bestSet1RM(sets) {
  if (!sets) return 0;
  return Math.max(0, ...sets.map(s => epley(s.w, s.r)));
}
function setVolume(sets) {
  if (!sets) return 0;
  return sets.reduce((n,s)=> n + (Number(s.w)||0)*(Number(s.r)||0), 0);
}

function defaultData() {
  return {
    weekTemplate: { 0:"rest", 1:"day1", 2:"day2", 3:"rest", 4:"day3", 5:"day4", 6:"rest" },
    overrides: {}, logs: {}, bodyweight: {}, foods: DEFAULT_FOODS, foodLogs: {},
    supplements: {},
    targets: { cal:4000, protein:200, fat:180, carbs:450 },
    firebaseConfig: null
  };
}

function loadLocal() {
  try {
    const raw = localStorage.getItem(LS_KEY) || localStorage.getItem("liftfuel_v2");
    if (!raw) return defaultData();
    const merged = { ...defaultData(), ...JSON.parse(raw) };
    if (!merged.foods || merged.foods.length < 20) merged.foods = DEFAULT_FOODS;
    if (!merged.supplements) merged.supplements = {};
    return merged;
  } catch { return defaultData(); }
}
function saveLocal() { localStorage.setItem(LS_KEY, JSON.stringify(state.data)); }
function scheduleSave() {
  saveLocal();
  setSyncStatus();
  clearTimeout(state.saveTimer);
  state.saveTimer = setTimeout(pushCloud, 600);
}

function plannedDay(dateStr) {
  if (state.data.overrides[dateStr]) return state.data.overrides[dateStr];
  return state.data.weekTemplate[weekday(dateStr)] || "rest";
}
function addDays(dateStr, n) {
  const d = parseISO(dateStr);
  d.setDate(d.getDate() + n);
  return isoDate(d);
}
function shiftTemplate(dir) {
  const t = state.data.weekTemplate;
  const next = {};
  for (let i=0;i<7;i++) next[i] = t[(i - dir + 7) % 7];
  state.data.weekTemplate = next;
  scheduleSave();
}
function pushWorkoutsAfterRest(startDate) {
  const original = plannedDay(startDate);
  if (original === "rest") return false;
  const chain = [{ date: startDate, plan: original }];
  let d = addDays(startDate, 1);
  for (let i = 0; i < 400; i++) {
    const plan = plannedDay(d);
    chain.push({ date: d, plan });
    if (plan === "rest") break;
    d = addDays(d, 1);
  }
  state.data.overrides[chain[0].date] = "rest";
  for (let i = 1; i < chain.length; i++) {
    state.data.overrides[chain[i].date] = chain[i - 1].plan;
  }
  scheduleSave();
  return true;
}

function lastLogForExercise(name, beforeDate) {
  const dates = Object.keys(state.data.logs).filter(d => d < beforeDate).sort().reverse();
  for (const d of dates) {
    const sets = state.data.logs[d]?.exercises?.[name];
    if (sets && sets.some(s => s.w || s.r)) return { date:d, sets };
  }
  return null;
}
function bestWeight(sets) {
  if (!sets || !sets.length) return 0;
  return Math.max(...sets.map(s => Number(s.w)||0));
}

function foodTotals(dateStr) {
  const items = state.data.foodLogs[dateStr] || [];
  return items.reduce((a,it) => {
    const f = state.data.foods.find(x => x.id === it.id);
    const q = Number(it.qty)||0;
    if (!f) return a;
    a.cal += f.cal*q; a.p += f.p*q; a.c += (f.c||0)*q; a.f += (f.f||0)*q;
    return a;
  }, { cal:0, p:0, c:0, f:0 });
}

function setSyncStatus(extra) {
  const el = document.getElementById("headerSub");
  if (!el) return;
  if (extra) { el.textContent = extra; return; }
  if (!state.data?.firebaseConfig?.apiKey) {
    el.textContent = "Local only · not synced";
    return;
  }
  if (!state.firebase.uid) {
    el.textContent = "Cloud ready · sign in (Settings)";
    return;
  }
  const when = state.lastSync ? new Date(state.lastSync).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}) : "just now";
  el.textContent = `Cloud synced · ${when}`;
}

function initFirebaseIfConfigured() {
  const cfg = state.data.firebaseConfig;
  if (!cfg || !cfg.apiKey) { setSyncStatus(); return; }
  try {
    if (!firebase.apps.length) state.firebase.app = firebase.initializeApp(cfg);
    else state.firebase.app = firebase.app();
    state.firebase.auth = firebase.auth();
    state.firebase.db = firebase.firestore();
    state.firebase.ready = true;
    setSyncStatus("Cloud ready · sign in (Settings)");
    state.firebase.auth.onAuthStateChanged(async (user) => {
      if (!user) { state.firebase.uid = null; setSyncStatus(); render(); return; }
      state.firebase.uid = user.uid;
      setSyncStatus("Syncing…");
      await pullCloud();
      state.lastSync = Date.now();
      setSyncStatus();
      render();
    });
  } catch (e) { setSyncStatus("Firebase error: " + e.message); }
}

async function pullCloud() {
  if (!state.firebase.uid) return;
  const snap = await state.firebase.db.collection("users").doc(state.firebase.uid).get();
  if (snap.exists && snap.data().payload) {
    const keepCfg = state.data.firebaseConfig;
    state.data = { ...defaultData(), ...snap.data().payload, firebaseConfig: keepCfg };
    if (!state.data.foods || state.data.foods.length < 20) state.data.foods = DEFAULT_FOODS;
    saveLocal();
  } else await pushCloud();
}
async function pushCloud() {
  if (!state.firebase.uid) return;
  const payload = { ...state.data }; delete payload.firebaseConfig;
  try {
    await state.firebase.db.collection("users").doc(state.firebase.uid).set({
      payload, updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge:true });
    state.lastSync = Date.now();
    setSyncStatus();
  } catch (e) { setSyncStatus("Sync failed · data still local"); }
}
async function signInGoogle() {
  if (!state.firebase.ready) return alert("Paste a valid Firebase config first.");
  const provider = new firebase.auth.GoogleAuthProvider();
  try { await state.firebase.auth.signInWithPopup(provider); }
  catch { await state.firebase.auth.signInWithRedirect(provider); }
}
async function signOut() { if (state.firebase.auth) await state.firebase.auth.signOut(); }

function showTab(tab) {
  state.tab = tab;
  document.querySelectorAll(".navbtn").forEach(b => {
    b.classList.toggle("text-amber-400", b.dataset.tab === tab);
    b.classList.toggle("text-zinc-400", b.dataset.tab !== tab);
  });
  ["calendar","workout","progress","food","settings"].forEach(t => {
    document.getElementById("view-"+t).classList.toggle("hidden", t !== tab);
  });
  if (tab==="calendar") renderCalendar();
  if (tab==="workout") renderWorkout();
  if (tab==="progress") renderProgress();
  if (tab==="food") renderFood();
  if (tab==="settings") renderSettings();
}
function render() { showTab(state.tab); }

function prettyDate(dateStr) {
  return parseISO(dateStr).toLocaleDateString(undefined, { weekday:"long", month:"short", day:"numeric" });
}
function hasLiftLog(dateStr) {
  const ex = state.data.logs[dateStr]?.exercises;
  return !!ex && Object.values(ex).some(s => s.some(x => x.w || x.r));
}
function renderCalendar() {
  const root = document.getElementById("view-calendar");
  const month = new Date(state.calMonth.getFullYear(), state.calMonth.getMonth(), 1);
  const startDow = month.getDay();
  const daysInMonth = new Date(month.getFullYear(), month.getMonth()+1, 0).getDate();
  const title = month.toLocaleString(undefined, { month:"long", year:"numeric" });
  const today = isoDate(new Date());
  const view = state.calView || "week";

  const weekAnchor = parseISO(state.selectedDate);
  weekAnchor.setDate(weekAnchor.getDate() - weekAnchor.getDay());
  const weekDates = Array.from({length:7}, (_,i) => addDays(isoDate(weekAnchor), i));
  const weekLabel = parseISO(weekDates[0]).toLocaleDateString(undefined,{month:"short",day:"numeric"})
    + " – " + parseISO(weekDates[6]).toLocaleDateString(undefined,{month:"short",day:"numeric"});

  let monthCells = "";
  for (let i=0;i<startDow;i++) monthCells += `<div></div>`;
  for (let d=1; d<=daysInMonth; d++) {
    const dateStr = isoDate(new Date(month.getFullYear(), month.getMonth(), d));
    const p = PROGRAM[plannedDay(dateStr)] || PROGRAM.rest;
    const cals = Math.round(foodTotals(dateStr).cal);
    const cls = ["daycell", p.id==="rest"?"is-rest":"", dateStr===today?"is-today":"", dateStr===state.selectedDate?"is-sel":""].join(" ");
    monthCells += `<button data-date="${dateStr}" class="${cls}">
      <div class="flex items-center justify-between">
        <span class="dnum">${d}</span>
        ${hasLiftLog(dateStr) ? '<span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>' : ""}
      </div>
      <div class="sess ${p.id==="rest"?"text-zinc-500":""}">${p.short || p.name}</div>
      <div class="kcal">${cals ? cals.toLocaleString() : "—"}</div>

        ${Object.values(PROGRAM).map(p => `<button data-assign="${p.id}" class="px-3 py-1.5 rounded-full text-sm font-medium ${plannedDay(state.selectedDate)===p.id?"bg-amber-500 text-zinc-950":"bg-zinc-800 text-zinc-300"}">${p.short||p.name}</button>`).join("")}

function ensureLog(dateStr) {
  if (!state.data.logs[dateStr]) state.data.logs[dateStr] = { programDay: plannedDay(dateStr), exercises: {}, notes: "" };
  if (state.data.logs[dateStr].notes == null) state.data.logs[dateStr].notes = "";
  return state.data.logs[dateStr];
}

function renderWorkout() {
  const root = document.getElementById("view-workout");
  const dateStr = state.selectedDate;
  const pid = plannedDay(dateStr);
  const prog = PROGRAM[pid] || PROGRAM.rest;
  const log = ensureLog(dateStr);
  log.programDay = pid;
  const bw = state.data.bodyweight[dateStr] ?? "";
  const supp = state.data.supplements[dateStr] || { creatine:false, omega:false, vitd:false };

  let html = `
    <div class="flex items-center justify-between mb-3">
      <div>
        <p class="text-xs text-zinc-400">${dateStr}</p>
        <h2 class="text-xl font-semibold">${prog.name}</h2>
      </div>
      <input type="date" id="logDate" value="${dateStr}" class="bg-zinc-800 rounded-lg px-2 py-1 text-sm" />
    </div>
    <div class="rounded-2xl border border-zinc-800 bg-zinc-900 p-3 mb-3 flex items-center gap-3">
      <label class="text-sm text-zinc-400">Body weight</label>
      <input id="bwInput" type="number" step="0.1" value="${bw}" placeholder="lb" class="flex-1 bg-zinc-800 rounded-lg px-3 py-2" />
      <span class="text-xs text-zinc-500">lb</span>
    </div>
    <div class="rounded-2xl border border-zinc-800 bg-zinc-900 p-3 mb-3">
      <p class="text-sm text-zinc-400 mb-2">Supplements</p>
      <div class="grid grid-cols-3 gap-2 text-sm">
        <label class="flex items-center gap-2 bg-zinc-800 rounded-lg px-2 py-2"><input type="checkbox" id="supC" ${supp.creatine?"checked":""}/> Creatine</label>
        <label class="flex items-center gap-2 bg-zinc-800 rounded-lg px-2 py-2"><input type="checkbox" id="supO" ${supp.omega?"checked":""}/> Omegas</label>
        <label class="flex items-center gap-2 bg-zinc-800 rounded-lg px-2 py-2"><input type="checkbox" id="supD" ${supp.vitd?"checked":""}/> Vitamin D</label>
      </div>
    </div>
    <textarea id="notes" rows="2" class="w-full bg-zinc-900 border border-zinc-800 rounded-2xl px-3 py-2 mb-3 text-sm" placeholder="Session notes (sleep, shoulder, pump… )">${log.notes||""}</textarea>
  `;

  if (pid === "rest") {
    html += `<p class="text-zinc-400 mb-6">Rest day. Change it on Calendar if you want to train.</p>`;
    root.innerHTML = html; bindWorkoutHeader(root); return;
  }

  const exercises = pid === "extra" ? Object.keys(log.exercises) : prog.exercises;
  if (pid === "extra") {
    html += `<div class="flex gap-2 mb-3"><input id="customEx" class="flex-1 bg-zinc-800 rounded-lg px-3 py-2" placeholder="Add exercise"/><button id="addEx" class="bg-amber-500 text-zinc-950 font-semibold px-3 rounded-lg">Add</button></div>`;
  }

  exercises.forEach(name => {
    if (!log.exercises[name]) log.exercises[name] = [{w:"",r:""},{w:"",r:""},{w:"",r:""}];
    const prev = lastLogForExercise(name, dateStr);
    const prevTxt = prev ? prev.sets.filter(s=>s.w||s.r).map(s => `${s.w||"-"}×${s.r||"-"}`).join("  ") : "no previous";
    const prev1 = prev ? Math.round(bestSet1RM(prev.sets)) : 0;
    html += `<div class="rounded-2xl border border-zinc-800 bg-zinc-900 p-3 mb-3" data-ex="${encodeURIComponent(name)}">
      <div class="flex justify-between gap-2 items-start">
        <h3 class="font-medium">${name}</h3>
        <div class="flex gap-2">
          ${prev ? `<button class="uselast text-[11px] text-zinc-300">Use last</button>` : ""}
          <button class="addset text-xs text-amber-400">+ set</button>
        </div>
      </div>
      <p class="text-[11px] text-zinc-500 mt-1">Last${prev?" ("+prev.date+")":""}: ${prevTxt}${prev1?` · est 1RM ${prev1} lb`:""}</p>
      <div class="sets mt-2 space-y-2">${log.exercises[name].map((s,i)=>setRow(s,i)).join("")}</div>
    </div>`;
  });

  html += `<button id="saveWorkout" class="w-full bg-amber-500 text-zinc-950 font-semibold rounded-xl py-3 mb-6">Save workout</button>`;
  root.innerHTML = html;
  bindWorkoutHeader(root);

  root.querySelectorAll("[data-ex]").forEach(card => {
    const name = decodeURIComponent(card.dataset.ex);
    card.querySelector(".addset").onclick = () => { log.exercises[name].push({w:"",r:""}); scheduleSave(); renderWorkout(); };
    const ul = card.querySelector(".uselast");
    if (ul) ul.onclick = () => {
      const prev = lastLogForExercise(name, dateStr);
      if (!prev) return;
      log.exercises[name] = prev.sets.map(s => ({ w:s.w, r:s.r }));
      scheduleSave(); renderWorkout();
    };
    card.querySelectorAll(".setw").forEach(inp => inp.oninput = () => { log.exercises[name][Number(inp.dataset.i)].w = inp.value; scheduleSave(); });
    card.querySelectorAll(".setr").forEach(inp => inp.oninput = () => { log.exercises[name][Number(inp.dataset.i)].r = inp.value; scheduleSave(); });
  });
  const addEx = root.querySelector("#addEx");
  if (addEx) addEx.onclick = () => {
    const n = root.querySelector("#customEx").value.trim(); if (!n) return;
    log.exercises[n] = [{w:"",r:""}]; scheduleSave(); renderWorkout();
  };
  root.querySelector("#saveWorkout").onclick = () => { scheduleSave(); alert("Saved"); };
}

function setRow(s,i) {
  return `<div class="grid grid-cols-[2rem_1fr_1fr] gap-2 items-center">
    <span class="text-xs text-zinc-500">${i+1}</span>
    <input class="setw bg-zinc-800 rounded-lg px-3 py-2" data-i="${i}" type="number" step="0.5" placeholder="lb" value="${s.w??""}" />
    <input class="setr bg-zinc-800 rounded-lg px-3 py-2" data-i="${i}" type="number" step="1" placeholder="reps" value="${s.r??""}" />
  </div>`;
}

function bindWorkoutHeader(root) {
  root.querySelector("#logDate").onchange = e => { state.selectedDate = e.target.value; renderWorkout(); };
  root.querySelector("#bwInput").oninput = e => {
    const v = e.target.value;
    if (v==="") delete state.data.bodyweight[state.selectedDate];
    else state.data.bodyweight[state.selectedDate] = Number(v);
    scheduleSave();
  };
  root.querySelector("#notes").oninput = e => { ensureLog(state.selectedDate).notes = e.target.value; scheduleSave(); };
  const saveSupp = () => {
    state.data.supplements[state.selectedDate] = {
      creatine: root.querySelector("#supC").checked,
      omega: root.querySelector("#supO").checked,
      vitd: root.querySelector("#supD").checked
    };
    scheduleSave();
  };
  root.querySelector("#supC").onchange = saveSupp;
  root.querySelector("#supO").onchange = saveSupp;
  root.querySelector("#supD").onchange = saveSupp;
}

function allExerciseNames() {
  const set = new Set();
  Object.values(PROGRAM).forEach(p => p.exercises.forEach(e => set.add(e)));
  Object.values(state.data.logs).forEach(l => Object.keys(l.exercises||{}).forEach(e => set.add(e)));
  return [...set];
}

function weekStart(dateStr) {
  const d = parseISO(dateStr);
  d.setDate(d.getDate() - d.getDay());
  return isoDate(d);
}
function weeklyVolume(anchor) {
  const start = weekStart(anchor);
  const s = parseISO(start);
  let total = 0;
  const byDay = {};
  for (let i=0;i<7;i++) {
    const dt = isoDate(new Date(s.getFullYear(), s.getMonth(), s.getDate()+i));
    const log = state.data.logs[dt];
    let v = 0;
    if (log?.exercises) Object.values(log.exercises).forEach(sets => v += setVolume(sets));
    byDay[dt] = v; total += v;
  }
  return { start, total, byDay };
}

function renderProgress() {
  const root = document.getElementById("view-progress");
  const pane = state.progPane || "lifts";
  root.innerHTML = `
    <div class="flex gap-2 mb-4">
      <button data-pane="lifts" class="flex-1 rounded-xl py-2 text-sm font-medium ${pane==="lifts"?"bg-amber-500 text-zinc-950":"bg-zinc-800"}">Lifts</button>
      <button data-pane="food" class="flex-1 rounded-xl py-2 text-sm font-medium ${pane==="food"?"bg-amber-500 text-zinc-950":"bg-zinc-800"}">Food</button>
    </div>
    <div id="progBody"></div>
  `;
  root.querySelectorAll("[data-pane]").forEach(b => b.onclick = () => { state.progPane = b.dataset.pane; renderProgress(); });
  if (pane==="food") renderFoodProgress(root.querySelector("#progBody"));
  else renderLiftProgress(root.querySelector("#progBody"));
}

function renderLiftProgress(box) {

    <select id="progEx" class="w-full bg-zinc-800 rounded-xl px-3 py-2 mt-1 mb-3">

  const liftPts = Object.keys(state.data.logs).sort().map(d => {
    const sets = state.data.logs[d].exercises?.[current];

  });
  const bwDates = Object.keys(state.data.bodyweight).sort();
  state.charts.bw = new Chart(document.getElementById("bwChart"), {
    type:"line",
    data:{ labels: bwDates.map(d=>d.slice(5)), datasets:[{ data: bwDates.map(d=>state.data.bodyweight[d]), borderColor:"#38bdf8", tension:.25 }] },
    options:{ plugins:{legend:{display:false}}, scales:{ y:{ ticks:{color:"#a1a1aa"} }, x:{ ticks:{color:"#a1a1aa"} } } }
  });
  box.querySelector("#progTable").innerHTML = `<h3 class="font-medium mb-2">Recent ${current}</h3>` +
    (liftPts.slice(-16).reverse().map(p => `<div class="flex justify-between py-1 border-b border-zinc-800"><span class="text-zinc-400">${p.x}</span><span>${p.best} lb · 1RM ${p.y}</span></div>`).join("") || "<p class='text-zinc-500'>No logs yet.</p>");
}

      plugins:{ legend:{ labels:{ color:"#a1a1aa" } } },
      scales:{
        y:{ ticks:{color:"#a1a1aa"}, title:{display:true,text:"kcal",color:"#a1a1aa"} },
        y1:{ position:"right", grid:{drawOnChartArea:false}, ticks:{color:"#34d399"} },
        x:{ ticks:{color:"#a1a1aa"} }
      }
    }
  });
}

function destroyCharts() {
  Object.values(state.charts).forEach(c => { try { c.destroy(); } catch {} });
  state.charts = {};
}
function foodDay(dateStr) {
  if (!state.data.foodLogs[dateStr]) state.data.foodLogs[dateStr] = [];
  return state.data.foodLogs[dateStr];
}

function renderFood() {
  const root = document.getElementById("view-food");
  const dateStr = state.selectedDate;
  const items = foodDay(dateStr);
  const totals = foodTotals(dateStr);
  const t = state.data.targets;
  const supp = state.data.supplements[dateStr] || { creatine:false, omega:false, vitd:false };

  root.innerHTML = `
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-xl font-semibold">Food</h2>
      <input type="date" id="foodDate" value="${dateStr}" class="bg-zinc-800 rounded-lg px-2 py-1 text-sm" />
    </div>
    <div class="grid grid-cols-2 gap-2 mb-3">
      <div class="rounded-2xl bg-zinc-900 border border-zinc-800 p-3"><p class="text-xs text-zinc-400">Calories</p><p class="text-xl font-semibold">${Math.round(totals.cal)} <span class="text-xs text-zinc-500">/ ${t.cal}</span></p></div>
      <div class="rounded-2xl bg-zinc-900 border border-zinc-800 p-3"><p class="text-xs text-zinc-400">Protein</p><p class="text-xl font-semibold">${Math.round(totals.p)}g <span class="text-xs text-zinc-500">/ ${t.protein}g</span></p></div>
      <div class="rounded-2xl bg-zinc-900 border border-zinc-800 p-3"><p class="text-xs text-zinc-400">Fat</p><p class="text-xl font-semibold">${Math.round(totals.f)}g <span class="text-xs text-zinc-500">/ ${t.fat||0}g</span></p></div>
      <div class="rounded-2xl bg-zinc-900 border border-zinc-800 p-3"><p class="text-xs text-zinc-400">Carbs</p><p class="text-xl font-semibold">${Math.round(totals.c)}g <span class="text-xs text-zinc-500">/ ${t.carbs||0}g</span></p></div>
    </div>
    <div class="rounded-2xl border border-zinc-800 bg-zinc-900 p-3 mb-3">
      <p class="text-sm text-zinc-400 mb-2">Supplements</p>
      <div class="grid grid-cols-3 gap-2 text-sm">
        <label class="flex items-center gap-2 bg-zinc-800 rounded-lg px-2 py-2"><input type="checkbox" id="supC" ${supp.creatine?"checked":""}/> Creatine</label>
        <label class="flex items-center gap-2 bg-zinc-800 rounded-lg px-2 py-2"><input type="checkbox" id="supO" ${supp.omega?"checked":""}/> Omegas</label>
        <label class="flex items-center gap-2 bg-zinc-800 rounded-lg px-2 py-2"><input type="checkbox" id="supD" ${supp.vitd?"checked":""}/> Vitamin D</label>
      </div>
    </div>
    <input id="foodSearch" class="w-full bg-zinc-800 rounded-xl px-3 py-2 mb-3" placeholder="Search foods..." />
    <div id="foodResults" class="mb-4 space-y-2"></div>
    <h3 class="font-medium mb-2">Logged today</h3>
    <div id="foodLogged" class="space-y-2 mb-6"></div>
    <div class="rounded-2xl border border-zinc-800 bg-zinc-900 p-3 mb-8">
      <h3 class="font-medium mb-2">Add custom food</h3>
      <div class="grid grid-cols-2 gap-2">
        <input id="nfName" class="col-span-2 bg-zinc-800 rounded-lg px-3 py-2" placeholder="Name" />
        <input id="nfCal" type="number" class="bg-zinc-800 rounded-lg px-3 py-2" placeholder="Calories per unit" />
        <input id="nfP" type="number" class="bg-zinc-800 rounded-lg px-3 py-2" placeholder="Protein g" />
        <input id="nfC" type="number" class="bg-zinc-800 rounded-lg px-3 py-2" placeholder="Carbs g" />
        <input id="nfF" type="number" class="bg-zinc-800 rounded-lg px-3 py-2" placeholder="Fat g" />
        <select id="nfUnit" class="bg-zinc-800 rounded-lg px-3 py-2"><option value="g">per gram</option><option value="ml">per ml</option><option value="each">per item</option></select>
        <input id="nfServ" class="bg-zinc-800 rounded-lg px-3 py-2" placeholder="Label (1 g / 1 scoop)" />
      </div>
      <button id="saveFood" class="mt-3 w-full bg-zinc-100 text-zinc-950 font-semibold rounded-xl py-2">Save to library</button>
    </div>
  `;

  const drawResults = (q="") => {
    const box = root.querySelector("#foodResults");
    const list = state.data.foods.filter(f => f.name.toLowerCase().includes(q.toLowerCase())).slice(0, 20);
    box.innerHTML = list.map(f => {
      const measured = f.unit === "g" || f.unit === "ml";
      const defQty = measured ? 100 : 1;
      return `<div class="flex items-center gap-2 bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2">
        <div class="flex-1 min-w-0">
          <p class="text-sm truncate">${f.name}</p>
          <p class="text-[11px] text-zinc-500">${measured ? `${f.cal} kcal/${f.unit}` : `${f.cal} kcal each`}</p>
        </div>
        <input data-qtyfor="${f.id}" type="number" step="${measured?1:0.5}" value="${defQty}" class="w-20 bg-zinc-800 rounded-lg px-2 py-1 text-sm" />
        <span class="text-[11px] text-zinc-500 w-8">${f.unit==="each"?"qty":f.unit}</span>
        <button data-add="${f.id}" class="text-sm bg-amber-500 text-zinc-950 font-semibold px-3 py-1 rounded-lg">Add</button>
      </div>`;
    }).join("") || `<p class="text-zinc-500 text-sm">No matches.</p>`;
    box.querySelectorAll("[data-add]").forEach(b => b.onclick = () => {
      const qtyInp = box.querySelector(`[data-qtyfor="${b.dataset.add}"]`);
      const qty = Number(qtyInp?.value) || 1;
      foodDay(dateStr).push({ id: b.dataset.add, qty });
      scheduleSave(); renderFood();
    });
  };
  drawResults();
  root.querySelector("#foodSearch").oninput = e => drawResults(e.target.value);

  root.querySelector("#foodLogged").innerHTML = items.map((it, idx) => {
    const f = state.data.foods.find(x => x.id === it.id);
    if (!f) return "";
    return `<div class="flex items-center gap-2 bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2">
      <div class="flex-1"><p class="text-sm">${f.name}</p>
      <p class="text-[11px] text-zinc-500">${Math.round(f.cal*it.qty)} kcal · ${Math.round(f.p*it.qty)}p</p></div>
      <input data-qty="${idx}" type="number" step="0.1" value="${it.qty}" class="w-20 bg-zinc-800 rounded-lg px-2 py-1 text-sm" />
      <span class="text-[11px] text-zinc-500">${f.unit==="each"?"qty":f.unit}</span>
      <button data-del="${idx}" class="text-zinc-500 text-sm">✕</button>
    </div>`;
  }).join("") || `<p class="text-zinc-500 text-sm">Nothing logged.</p>`;

  root.querySelectorAll("[data-qty]").forEach(inp => inp.onchange = () => {
    items[Number(inp.dataset.qty)].qty = Number(inp.value)||0; scheduleSave(); renderFood();
  });
  root.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { items.splice(Number(b.dataset.del),1); scheduleSave(); renderFood(); });
  root.querySelector("#foodDate").onchange = e => { state.selectedDate = e.target.value; renderFood(); };
  const saveSupp = () => {
    state.data.supplements[dateStr] = {
      creatine: root.querySelector("#supC").checked,
      omega: root.querySelector("#supO").checked,
      vitd: root.querySelector("#supD").checked
    };
    scheduleSave();
  };
  root.querySelector("#supC").onchange = saveSupp;
  root.querySelector("#supO").onchange = saveSupp;
  root.querySelector("#supD").onchange = saveSupp;
  root.querySelector("#saveFood").onclick = () => {
    const name = root.querySelector("#nfName").value.trim(); if (!name) return;
    const unit = root.querySelector("#nfUnit").value;
    state.data.foods.unshift({
      id: "custom_"+Date.now(), name,
      cal: Number(root.querySelector("#nfCal").value)||0,
      p: Number(root.querySelector("#nfP").value)||0,
      c: Number(root.querySelector("#nfC").value)||0,
      f: Number(root.querySelector("#nfF").value)||0,
      unit, serving: root.querySelector("#nfServ").value.trim() || (unit==="each"?"1 item":"1 "+unit)
    });
    scheduleSave(); renderFood();
  };
}

function renderSettings() {
  const root = document.getElementById("view-settings");
  const t = state.data.targets;
  root.innerHTML = `
    <h2 class="text-xl font-semibold mb-3">Settings</h2>
    <div class="rounded-2xl border border-zinc-800 bg-zinc-900 p-4 mb-4">
      <h3 class="font-medium mb-2">Targets</h3>
      <label class="text-xs text-zinc-400">Calories</label>
      <input id="tCal" type="number" value="${t.cal}" class="w-full bg-zinc-800 rounded-lg px-3 py-2 mb-2" />
      <label class="text-xs text-zinc-400">Protein (g)</label>
      <input id="tP" type="number" value="${t.protein}" class="w-full bg-zinc-800 rounded-lg px-3 py-2 mb-2" />
      <label class="text-xs text-zinc-400">Fat (g)</label>
      <input id="tF" type="number" value="${t.fat||0}" class="w-full bg-zinc-800 rounded-lg px-3 py-2 mb-2" />
      <label class="text-xs text-zinc-400">Carbs (g)</label>
      <input id="tC" type="number" value="${t.carbs||0}" class="w-full bg-zinc-800 rounded-lg px-3 py-2" />
    </div>
    <div class="rounded-2xl border border-zinc-800 bg-zinc-900 p-4 mb-4">
      <h3 class="font-medium mb-1">Firebase sync</h3>
      <p class="text-xs text-zinc-400 mb-2">Status: <span id="syncDetail">${document.getElementById("headerSub").textContent}</span></p>
      <ol class="text-xs text-zinc-400 list-decimal pl-4 space-y-1 mb-3">
        <li>Create a project at console.firebase.google.com</li>
        <li>Add a Web app and copy firebaseConfig</li>
        <li>Enable Authentication → Google</li>
        <li>Create Firestore; allow the signed-in user to read/write users/{uid}</li>
        <li>Paste config, save, sign in on phone and laptop</li>
      </ol>
      <textarea id="fbCfg" rows="7" class="w-full bg-zinc-800 rounded-lg px-3 py-2 text-xs font-mono" placeholder='{"apiKey":"..."}'>${state.data.firebaseConfig ? JSON.stringify(state.data.firebaseConfig,null,2) : ""}</textarea>
      <div class="flex gap-2 mt-3">
        <button id="saveFb" class="flex-1 bg-amber-500 text-zinc-950 font-semibold rounded-xl py-2">Save config</button>
        <button id="btnIn" class="flex-1 bg-zinc-100 text-zinc-950 font-semibold rounded-xl py-2">Sign in</button>
        <button id="btnOut" class="px-3 bg-zinc-800 rounded-xl">Out</button>
      </div>
    </div>
    <div class="rounded-2xl border border-zinc-800 bg-zinc-900 p-4 mb-8">
      <h3 class="font-medium mb-2">Backup</h3>
      <div class="flex gap-2">
        <button id="exp" class="flex-1 bg-zinc-800 rounded-xl py-2">Export JSON</button>
        <label class="flex-1 bg-zinc-800 rounded-xl py-2 text-center cursor-pointer">Import JSON<input id="imp" type="file" accept="application/json" class="hidden" /></label>
      </div>
    </div>
  `;
  root.querySelector("#tCal").onchange = e => { state.data.targets.cal = Number(e.target.value)||0; scheduleSave(); };
  root.querySelector("#tP").onchange = e => { state.data.targets.protein = Number(e.target.value)||0; scheduleSave(); };
  root.querySelector("#tF").onchange = e => { state.data.targets.fat = Number(e.target.value)||0; scheduleSave(); };
  root.querySelector("#tC").onchange = e => { state.data.targets.carbs = Number(e.target.value)||0; scheduleSave(); };
  root.querySelector("#saveFb").onclick = () => {
    try {
      const raw = root.querySelector("#fbCfg").value.trim();
      state.data.firebaseConfig = raw ? JSON.parse(raw) : null;
      saveLocal(); location.reload();
    } catch { alert("Invalid JSON"); }
  };
  root.querySelector("#btnIn").onclick = signInGoogle;
  root.querySelector("#btnOut").onclick = signOut;
  root.querySelector("#exp").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(state.data,null,2)],{type:"application/json"}));
    a.download = "the-logbook-backup.json"; a.click();
  };
  root.querySelector("#imp").onchange = async e => {
    const file = e.target.files[0]; if (!file) return;
    const keep = state.data.firebaseConfig;
    state.data = { ...defaultData(), ...JSON.parse(await file.text()), firebaseConfig: keep };
    scheduleSave(); render();
  };
}

document.querySelectorAll(".navbtn").forEach(b => b.onclick = () => showTab(b.dataset.tab));
document.getElementById("todayJump").onclick = () => {
  state.selectedDate = isoDate(new Date());
  state.calMonth = new Date();
  showTab("calendar");
};

state.data = loadLocal();
initFirebaseIfConfigured();
setSyncStatus();
render();
</script>
</body>
</html>
